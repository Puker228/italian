[project]
name = "italian"
version = "0.1.0"
description = "ИС «Школа изучения итальянского языка» — PyQt6 + PostgreSQL"
readme = "README.md"
authors = [
    { name = "danil", email = "danil@email.com" }
]
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pyqt6>=6.11.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.1.5",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.scripts]
italian = "italian:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "I", # isort: сортировка импортов
    "F401", # Pyflakes: неиспользуемые импорты
    "B", # flake8-bugbear: поиск потенциальных багов и проблем с дизайном
    "UP", # pyupgrade: обновление синтаксиса до актуальных версий Python
    "E", # pycodestyle: ошибки стиля
    "W", # pycodestyle: предупреждения стиля
    "C4", # flake8-comprehensions: оптимизация списковых включений (comprehensions)
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "W191", # indentation contains tabs
    "B904", # Allow raising exceptions without from e, for HTTPException
    "ARG001",
]
fixable = ["ALL"]
