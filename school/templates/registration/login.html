{% extends "school/base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
<div class="card shadow-sm"><div class="card-body">
  <h1 class="h4 mb-3">Вход в систему</h1>
  <form method="post">{% csrf_token %}
    {% if form.errors %}<div class="alert alert-danger">Неверное имя пользователя или пароль.</div>{% endif %}
    <div class="mb-3"><label class="form-label" for="id_username">Имя пользователя</label>
      <input class="form-control" id="id_username" name="username" autofocus required value="{{ form.username.value|default:'' }}"></div>
    <div class="mb-3"><label class="form-label" for="id_password">Пароль</label>
      <input class="form-control" id="id_password" type="password" name="password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100">Войти</button>
  </form>
</div></div>
</div></div>
{% endblock %}
